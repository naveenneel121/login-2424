# Replicaset Template
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: 10
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    
    spec:
      containers:
      - name: nginx
        image: ravi2krishna/login-2430
        ports:
        - containerPort: 80